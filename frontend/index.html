<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClinicFlow - Clinic Operations Platform</title>
    <meta
      name="description"
      content="Smarter clinic operations and patient experiences for private clinics and outpatient medical centers in Ethiopia."
    />
    <meta
      property="og:title"
      content="ClinicFlow - Clinic Operations Platform"
    />
    <meta
      property="og:description"
      content="Smarter clinic operations and patient experiences for private clinics and outpatient medical centers in Ethiopia."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("ClinicFlow-theme");
          var isDark =
            saved === "dark" ||
            (!saved &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-[#F8FAFC] text-slate-900 dark:bg-[#09090b] dark:text-zinc-100 antialiased font-sans min-h-screen"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
